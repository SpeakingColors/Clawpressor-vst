/* Clawpressor, Studio 87. Layout: wood cheek | dark panel | wood cheek. */
/* Whisker Scope, Studio 87. Layout: wood cheek | dark panel | wood cheek. Same house style as PurrOne. */
:root {
  --ground:#0b0b0d; --panel:#15161a; --panel-2:#1c1d22; --line:#2b2d34; --ink:#f4f5f7; --ink-dim:#a9adb8;
  --disp:#06080a; --grid:#1b2523;
  --cL:#02EBBA; --cR:#FF1383; --cM:#A43DFF; --cAcc:#FFD100;
  --f-label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme: dark;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--f-label); font-size:15px; letter-spacing:.04em;
  padding-block:12px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
#desk { position:relative; width:100%; }
#frame { position:absolute; touch-action:none; }
#win { position:absolute; left:0; top:0; width:1360px; height:1100px; transform-origin:0 0; }
.rz { position:absolute; z-index:50; touch-action:none; }
.rz.n,.rz.s { left:18px; right:18px; height:10px; cursor:ns-resize; } .rz.n { top:-5px; } .rz.s { bottom:-5px; }
.rz.e,.rz.w { top:18px; bottom:18px; width:10px; cursor:ew-resize; } .rz.e { right:-5px; } .rz.w { left:-5px; }
.rz.ne,.rz.nw,.rz.se,.rz.sw { width:20px; height:20px; } .rz.ne { top:-6px; right:-6px; cursor:nesw-resize; } .rz.nw { top:-6px; left:-6px; cursor:nwse-resize; } .rz.se { bottom:-6px; right:-6px; cursor:nwse-resize; } .rz.sw { bottom:-6px; left:-6px; cursor:nesw-resize; }
.rz:hover,.rz.drag { background:#02EBBA55; border-radius:3px; }
.unit { width:1360px; height:1100px; margin:0; display:grid; grid-template-columns:30px minmax(0,1fr) 30px; box-shadow:0 30px 80px #000c; border-radius:4px; overflow:hidden; }
.cheek { background:repeating-linear-gradient(92deg,#5B3A22 0 3px,#6E4729 3px 7px,#4E3120 7px 9px,#77502F 9px 14px); }
.cheek.l { box-shadow:inset -4px 0 8px rgba(0,0,0,.6); }
.cheek.r { box-shadow:inset 4px 0 8px rgba(0,0,0,.6); background:repeating-linear-gradient(88deg,#5B3A22 0 3px,#6E4729 3px 7px,#4E3120 7px 9px,#77502F 9px 14px); }
.panel { background:radial-gradient(ellipse at 50% 0%,#1e1f23 0%,var(--panel) 60%),var(--panel); padding:10px 14px 12px; display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; gap:10px; min-width:0; min-height:0; }
header.top { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center; padding-bottom:10px; border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:10px; }
.brand svg { width:38px; height:38px; }
.brand b { font-size:28px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
.brand small { display:block; font-size:12px; letter-spacing:.3em; color:var(--cAcc); text-transform:uppercase; margin-top:-2px; }
.presets { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto auto; gap:6px; align-items:center; position:relative; min-width:0; }
.pname { background:#0a0a0c; border:1px solid var(--line); border-radius:3px; padding:7px 12px; font-family:var(--f-num); font-size:14px; color:var(--ink); display:flex; justify-content:space-between; gap:8px; cursor:pointer; min-width:0; text-align:left; text-transform:none; letter-spacing:0; }
.pname span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pname span:last-child { color:var(--cL); font-size:12px; }
.tools { display:flex; gap:6px; }
button.panic { background:#4a0f1f; border-color:#ff1c6c; color:#ffd6e4; font-weight:700; }
button.panic:hover { background:#ff1c6c; color:#fff; }
.pmsg { color:#ff4f8f; font-weight:700; letter-spacing:.06em; }
.pmsg[hidden] { display:none; }
button.panic.hit { background:#ff1c6c; color:#fff; }
button,.btn { font:inherit; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); background:var(--panel-2); border:1px solid var(--line); border-radius:3px; padding:7px 11px; cursor:pointer; font-size:13px; }
button:hover { border-color:#4a4d58; }
button[aria-pressed="true"],button.on { background:#0f2a26; border-color:var(--cL); color:var(--cL); }
button:disabled { opacity:.45; cursor:default; }
button:focus-visible,.knob:focus-visible,.pname:focus-visible,select:focus-visible,input:focus-visible { outline:2px solid #6CC9F5; outline-offset:2px; }
select,input[type=text],textarea { font:inherit; font-size:13px; letter-spacing:.04em; background:#0a0a0c; color:var(--ink); border:1px solid var(--line); border-radius:3px; padding:6px 8px; }
textarea { width:100%; min-height:110px; font-family:var(--f-num); font-size:12px; letter-spacing:0; }
.plist { position:absolute; top:100%; left:0; right:0; z-index:30; margin-top:4px; background:#0a0a0c; border:1px solid #4a4d58; border-radius:4px; max-height:340px; overflow:auto; box-shadow:0 12px 30px #000c; }
.plist h4 { margin:0; padding:6px 12px; font-size:12px; letter-spacing:.2em; color:var(--ink-dim); text-transform:uppercase; border-bottom:1px solid var(--line); }
.plist button { display:block; width:100%; text-align:left; border:0; border-radius:0; background:none; text-transform:none; letter-spacing:.02em; font-size:15px; padding:7px 12px; }
.plist button:hover,.plist button[aria-current="true"] { background:var(--panel-2); color:var(--cL); }
.rig { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:8px 10px; background:var(--panel-2); border:1px solid var(--line); border-radius:4px; }
.rig .lab { font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim); }
.rig .grp { display:flex; gap:8px; align-items:center; }
.rig .note { font-size:12px; color:var(--ink-dim); letter-spacing:.04em; margin-left:auto; }
.rig .bpm { font-family:var(--f-num); font-size:13px; color:var(--cAcc); }
.main { display:grid; grid-template-columns:minmax(0,1fr) 236px; gap:10px; min-width:0; min-height:0; }
.viewcol { min-width:0; min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:8px; }
.tabs { display:flex; gap:6px; }
.tabs button { flex:1 1 0; font-size:15px; padding:9px 10px; letter-spacing:.14em; }
.disp { position:relative; min-height:0; background:var(--disp); border:1px solid var(--line); border-radius:4px; overflow:hidden; }
.disp canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.disp .hint { position:absolute; inset:0; display:grid; place-items:center; text-align:center; color:var(--ink-dim); font-size:18px; letter-spacing:.1em; pointer-events:none; padding:20px; }
.disp .hint[hidden] { display:none; }
.disp .hint b { color:var(--cL); }
.ctl { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:flex-end; padding:8px 10px; background:var(--panel-2); border:1px solid var(--line); border-radius:4px; }
.ctl[hidden],.disp canvas[hidden] { display:none; }
.fld { display:grid; gap:3px; min-width:0; }
.fld > span { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-dim); }
.kw { display:grid; justify-items:center; gap:2px; width:84px; }
.knob { position:relative; width:44px; height:44px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#33363f,var(--knob,#23252c) 70%); border:1px solid #3a3d48; cursor:ns-resize; touch-action:none; }
.knob svg { position:absolute; inset:-5px; width:54px; height:54px; pointer-events:none; }
.knob .tick { position:absolute; left:50%; top:50%; width:2px; height:15px; margin-left:-1px; margin-top:-19px; background:var(--ink); border-radius:1px; transform-origin:50% 19px; }
.kl { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim); text-align:center; white-space:nowrap; }
.kv { font-family:var(--f-num); font-size:12px; color:var(--cL); }
.meters { display:flex; flex-direction:column; gap:7px; min-height:0; overflow:hidden; background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:10px; }
.meters h3 { margin:0; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim); display:flex; justify-content:space-between; align-items:center; }
.mcv { position:relative; flex:1 1 0; min-height:100px; background:var(--disp); border:1px solid var(--line); border-radius:3px; }
.mcv canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.led { display:inline-block; width:10px; height:10px; border-radius:50%; background:#3a1020; margin-left:4px; }
.led.on { background:#ff2d95; box-shadow:0 0 10px #ff2d95; }
.ro { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; font-family:var(--f-num); font-size:11px; letter-spacing:0; }
.ro div { white-space:nowrap; }
.ro div { display:flex; justify-content:space-between; gap:4px; }
.ro span { color:var(--ink-dim); } .ro b { font-weight:500; color:var(--cAcc); }
.corr { position:relative; height:46px; background:var(--disp); border:1px solid var(--line); border-radius:3px; }
.corr canvas { position:absolute; inset:0; width:100%; height:100%; }
.foot { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim); border-top:1px solid var(--line); padding-top:8px; }
.foot b { color:var(--ink); }
.modal { position:fixed; inset:0; z-index:60; background:#000a; display:grid; place-items:center; padding:16px; }
.modal[hidden] { display:none; }
.card { width:min(560px,100%); max-height:88vh; overflow:auto; background:var(--panel); border:1px solid #4a4d58; border-radius:6px; padding:16px 18px; box-shadow:0 20px 60px #000; display:grid; gap:10px; }
.card h2 { margin:0; font-size:22px; letter-spacing:.14em; text-transform:uppercase; }
.card h3 { margin:6px 0 0; font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--cL); }
.card p,.card li { margin:0; font-size:15px; letter-spacing:.02em; line-height:1.35; color:#d6d8de; }
.card ul { margin:0; padding-left:18px; display:grid; gap:3px; }
.card .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.card .set { display:flex; justify-content:space-between; align-items:center; gap:10px; }
a.btn { text-decoration:none; display:inline-block; }
a.btn[aria-disabled="true"] { opacity:.45; pointer-events:none; }
.tip { position:fixed; z-index:80; max-width:260px; background:#0a0a0c; border:1px solid #4a4d58; border-radius:4px; padding:7px 10px; font-size:13px; letter-spacing:.02em; pointer-events:none; box-shadow:0 8px 24px #000c; }
.tip b { display:block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--cL); margin-bottom:2px; }
.tip[hidden] { display:none; }
/* shapes page groups */
.sgrid { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:8px; width:100%; }
.g3 { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:flex-end; align-content:flex-start; border:1px solid var(--line); border-radius:4px; padding:7px 9px 8px; background:#121317; min-width:0; }
.g3.wide { grid-column:1 / -1; }
.g3 > .gh { flex:1 0 100%; display:flex; gap:8px; align-items:baseline; font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink); }
.g3 > .gh i { font-style:normal; display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--cAcc); color:#111; font-weight:700; font-size:13px; letter-spacing:0; }
.g3 > .gh small { letter-spacing:.03em; text-transform:none; font-size:12.5px; color:var(--ink-dim); }
.g3 .st { font-family:var(--f-num); font-size:12px; color:var(--cAcc); letter-spacing:0; text-transform:none; }
.g3 .kw { width:76px; }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }

:root { --b1:#02EBBA; --b2:#FFD100; --b3:#FF1383; --b4:#A43DFF; }
.panel { grid-template-rows:auto auto minmax(0,1fr) auto; }
.main { grid-template-columns:minmax(0,1fr) 236px; }
.viewcol { grid-template-rows:auto minmax(0,1fr) auto auto; }
.tabrow { display:flex; gap:6px; align-items:center; }
.tabrow .tabs { flex:1 1 auto; }
.bsel { display:flex; gap:4px; align-items:center; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-dim); }
.bsel button { padding:7px 11px; }
.bsel button[aria-pressed="true"] { color:#111; }
.bsel button[data-b="1"][aria-pressed="true"] { background:var(--b1); border-color:var(--b1); }
.bsel button[data-b="2"][aria-pressed="true"] { background:var(--b2); border-color:var(--b2); }
.bsel button[data-b="3"][aria-pressed="true"] { background:var(--b3); border-color:var(--b3); color:#fff; }
.bsel button[data-b="4"][aria-pressed="true"] { background:var(--b4); border-color:var(--b4); color:#fff; }
.bands { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
.band { background:var(--panel-2); border:1px solid var(--line); border-top:3px solid var(--bc); border-radius:4px; padding:6px 6px 8px; display:grid; gap:4px; min-width:0; }
.band.off { opacity:.4; }
.band .bh { display:flex; gap:4px; align-items:center; justify-content:space-between; }
.band .bh b { font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:var(--bc); white-space:nowrap; }
.band .bh small { font-family:var(--f-num); font-size:10.5px; color:var(--ink-dim); letter-spacing:0; }
.band .bh .sm { display:flex; gap:3px; }
.band .bh .sm button { padding:3px 6px; font-size:11px; }
.band .kg { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:2px 0; }
.band .kw { width:auto; }
.band .kw .knob { --knob:#23252c; }
.band .tg { display:flex; gap:4px; flex-wrap:wrap; }
.band .tg button { padding:3px 7px; font-size:11px; letter-spacing:.06em; }
.band .lbl { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim); border-top:1px solid var(--line); padding-top:3px; }
.mainbox { background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:8px 8px 6px; display:grid; gap:4px; }
.mainbox h3 { margin:0; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim); }
.mainbox .kg { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:2px 0; }
.mainbox .kw { width:auto; }
.mainbox .tg { display:flex; gap:4px; flex-wrap:wrap; }
.mainbox .tg button { padding:4px 8px; font-size:11px; }
aside.meters { padding:8px; gap:6px; }
.mcv { min-height:0; }
.dens { height:12px; background:var(--disp); border:1px solid var(--line); border-radius:3px; position:relative; overflow:hidden; }
.dens i { position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg,#398BC4,#02EBBA,#FFD100,#FF1383); }
.pgrid { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
.rig .kw, .lanerow .kw { display:grid; grid-template-columns:auto auto; grid-template-areas:"k l" "k v"; align-items:center; justify-items:start; column-gap:8px; width:auto; }
.rig .kw .knob, .lanerow .kw .knob { grid-area:k; transform:scale(.72); margin:-7px -5px; }
.rig .kw .kl, .lanerow .kw .kl { grid-area:l; text-align:left; } .rig .kw .kv, .lanerow .kw .kv { grid-area:v; }
.rig .grp .fld { gap:1px; }
.band .kw { gap:0; } .band .knob { transform:scale(.88); margin:-3px 0; }
.hint2 { position:absolute; left:10px; top:8px; font-size:12px; letter-spacing:.1em; color:var(--ink-dim); pointer-events:none; text-transform:uppercase; }
</style>

<script>
var KIT = {key:"clawpressor", W:1360, H:1100};
/* Studio 87 mockup kit: helpers, info bubbles, knobs, selects, toggles, resizable window, modals, presets, frame loop.
   Each mockup sets KIT = { key, W, H } before this file runs. */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };
